<div class="api-keys-container">
  <div class="card">
    <h2>{{ 'settings.customize' | t }}</h2>
    <p class="section-description">{{ 'settings.languageDescription' | t }}</p>
    <div class="form-group">
      <label for="language">{{ 'settings.language' | t }}</label>
      <select
        id="language"
        class="form-control language-select"
        [ngModel]="i18n.language"
        (ngModelChange)="onLanguageChange($event)"
      >
        <option *ngFor="let lang of i18n.supportedLanguages" [value]="lang.code">
          {{ lang.label }}
        </option>
      </select>
    </div>
    <div class="form-group">
      <label class="checkbox-label">
        <input
          type="checkbox"
          [ngModel]="continueWhereYouLeftOff"
          (ngModelChange)="onContinueWhereYouLeftOffChange($event)"
        >
        <span>{{ 'settings.continueWhereYouLeftOff' | t }}</span>
      </label>
      <p class="section-description">{{ 'settings.continueWhereYouLeftOffDescription' | t }}</p>
    </div>
  </div>

  <div class="card">
    <h2>{{ 'settings.apiKeys' | t }}</h2>
    
    <form [formGroup]="apiKeysForm" (ngSubmit)="onSubmit()" class="api-keys-form">
      <div class="form-group">
        <label for="openaiApiKey">{{ 'settings.openaiKey' | t }}</label>
        <div class="input-group">
          <input 
            [type]="showOpenAIKey ? 'text' : 'password'"
            id="openaiApiKey"
            formControlName="openaiApiKey"
            class="form-control"
            [placeholder]="'settings.openaiPlaceholder' | t"
          >
          <button 
            type="button" 
            class="btn btn-outline-secondary" 
            (click)="toggleKeyVisibility('openaiApiKey')"
          >
            <i [class]="showOpenAIKey ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="geminiApiKey">{{ 'settings.geminiKey' | t }}</label>
        <div class="input-group">
          <input 
            [type]="showGeminiKey ? 'text' : 'password'"
            id="geminiApiKey"
            formControlName="geminiApiKey"
            class="form-control"
            [placeholder]="'settings.geminiPlaceholder' | t"
          >
          <button 
            type="button" 
            class="btn btn-outline-secondary" 
            (click)="toggleKeyVisibility('geminiApiKey')"
          >
            <i [class]="showGeminiKey ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-primary" [disabled]="!apiKeysForm.valid">{{ 'settings.saveKeys' | t }}</button>
        <button type="button" class="btn btn-danger" (click)="clearKeys()">{{ 'settings.clearKeys' | t }}</button>
      </div>

      <div *ngIf="showSuccessMessage" class="alert alert-success mt-3">
        {{ 'settings.keysSaved' | t }}
      </div>
    </form>
  </div>
</div>
