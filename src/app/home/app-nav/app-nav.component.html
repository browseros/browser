<div class="navs">
    <span *ngIf="currentApp?.id">
        <div *ngFor="let tab of tabsInternal" 
             [style.display]="tab.appId === currentApp.id ? 'flex': 'none'"
             class="tab-on-nav"
             [title]="tab.title"
             [class.active]="currentTabInternal && tab.id === currentTabInternal.id"
             (click)="onGotoTab.emit(tab)"
             (contextmenu)="onContextMenu.emit(tab)"
             (mouseup)="onMouseUp($event, tab)"
             [style.width]="getTabWidth()">
            <button class="tab-close" 
                    (click)="$event.stopPropagation(); onCloseTab.emit(tab)"
                    [title]="'appBar.closeTab' | t">
                <i class="bi bi-x"></i>
            </button>
            <span class="tab-title">{{tab.title || ('nav.newTab' | t)}}</span>
        </div>
    </span>
    
    <div class="nav-actions">
        <button class="nav-button" (click)="onReload()" [disabled]="!currentApp?.id" [title]="'nav.reload' | t">
            <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button class="nav-button" (click)="onBack()" [disabled]="!currentApp?.id" [title]="'nav.back' | t">
            <i class="bi bi-chevron-left"></i>
        </button>
        <button class="nav-button" (click)="onNext()" [disabled]="!currentApp?.id" [title]="'nav.forward' | t">
            <i class="bi bi-chevron-right"></i>
        </button>
        
        <div class="dropdown" *ngIf="currentApp?.id">
            <button class="nav-button recent-button" 
                    type="button" 
                    data-bs-toggle="dropdown" 
                    aria-expanded="false"
                    (click)="updateHistories()"
                    [title]="'nav.recent' | t">
                <span>{{ 'nav.recent' | t }}</span>
                <i class="bi bi-chevron-down"></i>
            </button>
            <ul class="dropdown-menu">
                <li *ngFor="let item of filteredHistories">
                    <a class="dropdown-item recent-item" 
                       (click)="selectHistoryItem(item)" 
                       [title]="item.title || item.link">
                        <div class="recent-item-title">{{item.title || ('nav.untitled' | t)}}</div>
                        <div class="recent-item-link" [title]="item.link">{{getShortenedUrl(item.link)}}</div>
                    </a>
                </li>
                <li *ngIf="filteredHistories.length === 0">
                    <span class="dropdown-item disabled">{{ 'nav.noRecentItems' | t }}</span>
                </li>
            </ul>
        </div>

        <div class="dropdown" *ngIf="currentApp?.id">
            <button class="nav-button zoom-button" 
                    type="button" 
                    data-bs-toggle="dropdown" 
                    aria-expanded="false"
                    [title]="'nav.zoom' | t">
                {{(currentZoom * 100).toFixed(0)}}%
                <i class="bi bi-chevron-down"></i>
            </button>
            <ul class="dropdown-menu zoom-menu">
                <li>
                    <a class="dropdown-item zoom-item" (click)="onZoomIn($event)">
                        <i class="bi bi-search"></i>
                        {{ 'nav.zoomIn' | t }}
                    </a>
                </li>
                <li>
                    <a class="dropdown-item zoom-item" (click)="onZoomOut($event)">
                        <i class="bi bi-search"></i>
                        {{ 'nav.zoomOut' | t }}
                    </a>
                </li>
                <li>
                    <a class="dropdown-item zoom-item" (click)="onZoomReset($event)">
                        <i class="bi bi-arrow-counterclockwise"></i>
                        {{ 'nav.zoomReset' | t }}
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>
